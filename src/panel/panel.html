<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebTranslate Panel</title>
  <style>
    :root {
      --bg: #f8f9fa; --surface: #ffffff; --text: #1d1b20; --muted: #79747e;
      --primary: #6750a4; --primary-light: #eaddff;
      --border: #e7e0ec; --outline: #cac4d0; --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      height: 100vh; overflow: hidden;
    }
    header {
      font-size: 16px; font-weight: 600;
      padding-bottom: 12px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo {
      width: 26px; height: 26px; border-radius: 7px;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
    }
    .header-title { color: var(--primary); font-weight: 700; }
    #badge {
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    #badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--outline); display: inline-block;
    }
    #badge.connected::before { background: #386a20; }
    #badge.waiting::before { background: #79747e; animation: wt-pulse 1.5s ease-in-out infinite; }
    #badge.disconnected::before { background: #b3261e; }
    @keyframes wt-pulse { 0%,100%{ opacity:1 } 50%{ opacity:.4 } }
    .empty {
      color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px;
    }
    .item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
    }
    .item .orig {
      font-size: 13px; color: var(--muted); margin-bottom: 6px; word-break: break-word;
    }
    .item .trans {
      font-size: 14px; color: var(--text); word-break: break-word;
    }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .actions button {
      background: var(--surface); border: 1px solid var(--outline); border-radius: 16px;
      padding: 4px 14px; font-size: 12px; font-weight: 500;
      cursor: pointer; color: var(--primary); transition: background .15s;
    }
    .actions button:hover { background: var(--primary-light); }
    #list { height: calc(100vh - 80px); overflow-y: auto; }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    #list::-webkit-scrollbar { width: 4px; }
    #list::-webkit-scrollbar-track { background: transparent; }
    #list::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="header-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M2 7V2h5" stroke="#6750a4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 2h5v5" stroke="#6750a4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17v5h5" stroke="#6750a4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 22h5v-5" stroke="#6750a4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="6.5" stroke="#6750a4" stroke-width="1.5"/>
          <path d="M8.5 8.5h7v1.4h-2.8v5.6h-1.4V9.9H8.5z" fill="#6750a4"/>
        </svg>
      </div>
      <span class="header-title" data-i18n="panel.title">WebTranslate</span>
    </div>
    <span id="badge" data-i18n="panel.waiting">Waiting for translation...</span>
  </header>
  <div id="list">
    <div class="empty" data-i18n="panel.empty_hint">Click the translate button on the page to see translations here</div>
  </div>
  <script type="module" src="./panel.js"></script>
</body>
</html>
