<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebTranslate Panel</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --card: rgba(15,23,42,.95);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --border: rgba(148,163,184,.12);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      height: 100vh;
      overflow: hidden;
    }
    header {
      font-size: 16px;
      font-weight: 600;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 16px rgba(34,211,238,.03);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 26px; height: 26px; border-radius: 5px;
      background: linear-gradient(135deg, rgba(6,182,212,.1), rgba(15,23,42,.9));
      border: 1px solid rgba(34,211,238,.2);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px rgba(34,211,238,.08);
    }
    .header-title { color: var(--accent); font-weight: 700; }
    #badge {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
      box-shadow: 0 0 6px currentColor;
    }
    #badge.connected::before { background: #10b981; color: #10b981; box-shadow: 0 0 8px rgba(16,185,129,.5); }
    #badge.waiting::before { background: #f59e0b; color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,.4); animation: wt-pulse 1.5s ease-in-out infinite; }
    #badge.disconnected::before { background: #ef4444; color: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,.5); }
    @keyframes wt-pulse { 0%,100%{ opacity:1 } 50%{ opacity:.5 } }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 0;
      font-size: 14px;
    }
    .item {
      background: rgba(15,23,42,.6);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 0 16px rgba(34,211,238,.03);
    }
    .item .orig {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      word-break: break-word;
    }
    .item .trans {
      font-size: 14px;
      color: var(--text);
      word-break: break-word;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .actions button {
      background: rgba(15,23,42,.8);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text);
      transition: all .2s;
    }
    .actions button:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(34,211,238,.05);
      box-shadow: 0 0 10px rgba(34,211,238,.08);
    }
    #list {
      height: calc(100vh - 80px);
      overflow-y: auto;
    }
    /* ---- Focus-visible ---- */
    button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    #list::-webkit-scrollbar { width: 4px; }
    #list::-webkit-scrollbar-track { background: transparent; }
    #list::-webkit-scrollbar-thumb { background: rgba(148,163,184,.2); border-radius: 2px; }
    #list::-webkit-scrollbar-thumb:hover { background: rgba(34,211,238,.3); }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="header-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M2 7V2h5" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 2h5v5" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17v5h5" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 22h5v-5" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="6.5" stroke="#22d3ee" stroke-width="1.5"/>
          <path d="M8.5 8.5h7v1.4h-2.8v5.6h-1.4V9.9H8.5z" fill="#fff"/>
        </svg>
      </div>
      <span class="header-title" data-i18n="panel.title">WebTranslate</span>
    </div>
    <span id="badge" data-i18n="panel.waiting">Waiting for translation...</span>
  </header>
  <div id="list">
    <div class="empty" data-i18n="panel.empty_hint">Click the translate button on the page to see translations here</div>
  </div>
  <script type="module" src="./panel.js"></script>
</body>
</html>
